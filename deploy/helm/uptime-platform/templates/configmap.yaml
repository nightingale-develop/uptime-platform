apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "uptime-platform.configMapName" . }}
  labels:
    {{- include "uptime-platform.labels" . | nindent 4 }}
data:
  NOTIFICATION_TIMEOUT_SECONDS: {{ .Values.config.notificationTimeoutSeconds | quote }}
  PUBLIC_APP_URL: {{ .Values.config.publicAppUrl | quote }}
  RETENTION_ENABLED: {{ .Values.config.retentionEnabled | quote }}
  RETENTION_CHECKS_DAYS: {{ .Values.config.retentionChecksDays | quote }}
  RETENTION_INCIDENTS_DAYS: {{ .Values.config.retentionIncidentsDays | quote }}
  RETENTION_NOTIFICATIONS_DAYS: {{ .Values.config.retentionNotificationsDays | quote }}
  RETENTION_INTERVAL_SECONDS: {{ .Values.config.retentionIntervalSeconds | quote }}
  RETENTION_BATCH_SIZE: {{ .Values.config.retentionBatchSize | quote }}
  JWT_ACCESS_TOKEN_TTL_MINUTES: {{ .Values.config.jwtAccessTokenTtlMinutes | quote }}
  REFRESH_TOKEN_TTL_DAYS: {{ .Values.config.refreshTokenTtlDays | quote }}
  REFRESH_COOKIE_NAME: {{ .Values.config.refreshCookieName | quote }}
  REFRESH_COOKIE_SECURE: {{ .Values.config.refreshCookieSecure | quote }}
  REFRESH_COOKIE_SAMESITE: {{ .Values.config.refreshCookieSameSite | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  METRICS_HOST: "0.0.0.0"

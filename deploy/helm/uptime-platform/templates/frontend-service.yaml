apiVersion: v1
kind: Service
metadata:
  name: {{ include "uptime-platform.frontendName" . }}
  labels:
    {{- include "uptime-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "uptime-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP

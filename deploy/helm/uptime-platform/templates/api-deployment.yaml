apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uptime-platform.fullname" . }}-api
  labels:
    {{- include "uptime-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      {{- include "uptime-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "uptime-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "uptime-platform.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.migrations.enabled }}
      initContainers:
        {{- include "uptime-platform.migrationWaitInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- include "uptime-platform.containerSecurityContext" . | nindent 12 }}
          command: ["fastapi"]
          args:
            - run
            - src/uptime_platform/main.py
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.backend.port | quote }}
            - --workers
            - "1"
          envFrom:
            - configMapRef:
                name: {{ include "uptime-platform.configMapName" . }}
            - secretRef:
                name: {{ include "uptime-platform.secretName" . }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- if .Values.secrets.create }}
{{- $name := include "uptime-platform.secretName" . -}}

{{/*
On a fresh install we deliberately avoid lookup().
On upgrades we reuse credentials from the existing Secret so that
database/auth secrets are not regenerated.
*/}}
{{- $existingData := dict -}}
{{- if .Release.IsUpgrade -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
  {{- if $existing -}}
    {{- $existingData = (get $existing "data") | default dict -}}
  {{- end -}}
{{- end -}}

{{- $postgresPassword := .Values.postgresql.auth.password -}}
{{- if and (empty $postgresPassword) (hasKey $existingData "POSTGRES_PASSWORD") -}}
  {{- $postgresPassword = (index $existingData "POSTGRES_PASSWORD" | b64dec) -}}
{{- end -}}
{{- if empty $postgresPassword -}}
  {{- $postgresPassword = randAlphaNum 48 -}}
{{- end -}}

{{- $jwtSecret := .Values.secrets.jwtSecret -}}
{{- if and (empty $jwtSecret) (hasKey $existingData "JWT_SECRET") -}}
  {{- $jwtSecret = (index $existingData "JWT_SECRET" | b64dec) -}}
{{- end -}}
{{- if empty $jwtSecret -}}
  {{- $jwtSecret = randAlphaNum 64 -}}
{{- end -}}

{{- $refreshSecret := .Values.secrets.refreshTokenHashSecret -}}
{{- if and (empty $refreshSecret) (hasKey $existingData "REFRESH_TOKEN_HASH_SECRET") -}}
  {{- $refreshSecret = (index $existingData "REFRESH_TOKEN_HASH_SECRET" | b64dec) -}}
{{- end -}}
{{- if empty $refreshSecret -}}
  {{- $refreshSecret = randAlphaNum 64 -}}
{{- end -}}

{{- $apiKeySecret := .Values.secrets.apiKeyHashSecret -}}
{{- if and (empty $apiKeySecret) (hasKey $existingData "API_KEY_HASH_SECRET") -}}
  {{- $apiKeySecret = (index $existingData "API_KEY_HASH_SECRET" | b64dec) -}}
{{- end -}}
{{- if empty $apiKeySecret -}}
  {{- $apiKeySecret = randAlphaNum 64 -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "uptime-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgresql.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgresql.auth.username | quote }}
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}

  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s:5432/%s" .Values.postgresql.auth.username $postgresPassword (include "uptime-platform.postgresqlName" .) .Values.postgresql.auth.database | quote }}

  JWT_SECRET: {{ $jwtSecret | quote }}
  REFRESH_TOKEN_HASH_SECRET: {{ $refreshSecret | quote }}
  API_KEY_HASH_SECRET: {{ $apiKeySecret | quote }}
{{- end }}
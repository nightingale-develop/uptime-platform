apiVersion: v1
kind: Service
metadata:
  # The frontend nginx.conf uses http://api:8000, so this Service must be named api.
  name: api
  labels:
    {{- include "uptime-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "uptime-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP

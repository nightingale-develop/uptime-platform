name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: uptime
          POSTGRES_PASSWORD: uptime
          POSTGRES_DB: uptime_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U uptime -d uptime_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/check
      - id: version
        run: echo "version=$(uv run --locked python scripts/version.py)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-images
        with:
          backend: uptime-platform:ci
          frontend: uptime-platform-frontend:ci
          version: ${{ steps.version.outputs.version }}
          revision: ${{ github.sha }}

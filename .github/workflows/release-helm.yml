name: Release Helm Chart

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "deploy/helm/uptime-platform/**"
      - ".github/workflows/publish-helm.yml"

permissions:
  contents: write

concurrency:
  group: publish-helm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: |
          helm lint deploy/helm/uptime-platform

      - name: Package chart
        run: |
          mkdir -p .helm-dist

          helm package \
            deploy/helm/uptime-platform \
            --destination .helm-dist

          ls -la .helm-dist

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Publish chart
        run: |
          PACKAGE="$(find .helm-dist -maxdepth 1 -name '*.tgz' -print -quit)"
          PACKAGE_NAME="$(basename "$PACKAGE")"

          echo "Publishing $PACKAGE_NAME"

          if [ -f "pages/$PACKAGE_NAME" ]; then
            echo "ERROR: $PACKAGE_NAME already exists."
            echo "Increase version in deploy/helm/uptime-platform/Chart.yaml."
            exit 1
          fi

          cp "$PACKAGE" pages/

          if [ -f pages/index.yaml ]; then
            helm repo index pages \
              --url https://nightingale-develop.github.io/uptime-platform \
              --merge pages/index.yaml
          else
            helm repo index pages \
              --url https://nightingale-develop.github.io/uptime-platform
          fi

      - name: Commit gh-pages
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.yaml '*.tgz'

          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi

          git commit -m "Publish Helm chart"
          git push origin HEAD:gh-pages
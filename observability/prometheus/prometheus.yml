global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: uptime-api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
        refresh_interval: 15s
  - job_name: uptime-scheduler
    dns_sd_configs:
      - names: [scheduler]
        type: A
        port: 9001
        refresh_interval: 15s
  - job_name: uptime-worker
    dns_sd_configs:
      - names: [notification-worker]
        type: A
        port: 9002
        refresh_interval: 15s
